name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below to help us reproduce and fix the issue.

  - type: dropdown
    id: bug-category
    attributes:
      label: Bug Category
      description: What type of bug are you experiencing?
      options:
        - 🎨 UI/UX Issues
        - 🔧 Core Functionality
        - 📱 Mobile Issues
        - 🚀 Performance Issues
        - 🔒 Security Issues
        - 🌐 Network/API Issues
        - 📊 Analytics Issues
        - 🎯 AI/ML Issues
        - 🔌 Integration Issues
        - 🐳 Deployment Issues
        - Other
    validations:
      required: true

  - type: input
    id: bug-title
    attributes:
      label: Bug Title
      description: A clear, concise title for the bug
      placeholder: "Chat history not loading on mobile"
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: "Describe what happened and what you expected to happen..."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: "Describe what should have happened..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: "Describe what actually happened..."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide your environment details
      placeholder: |
        - OS: [e.g. Windows 10, macOS 12.0, Ubuntu 20.04]
        - Python Version: [e.g. 3.9.7]
        - Browser: [e.g. Chrome 91, Firefox 89, Safari 14]
        - Streamlit Version: [e.g. 1.21.0]
        - App Version: [e.g. v2.0.0]
    validations:
      required: true

  - type: textarea
    id: error-logs
    attributes:
      label: Error Logs
      description: Any error messages or logs
      placeholder: "Paste any error messages or logs here..."

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context about the problem
      placeholder: "Add any other context, screenshots, or information..."

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have provided all the required information
          required: true
        - label: I can reproduce this bug consistently
          required: true
