# GitHub Labels Configuration for Stardust.ai Chatbot
# This file defines all the labels used in the repository

# Priority Labels
- name: "priority: critical"
  color: "d73a4a"
  description: "Critical issues that need immediate attention"

- name: "priority: high"
  color: "f85149"
  description: "High priority issues that should be addressed soon"

- name: "priority: medium"
  color: "fbca04"
  description: "Medium priority issues"

- name: "priority: low"
  color: "0e8a16"
  description: "Low priority issues"

# Type Labels
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"

- name: "feature-request"
  color: "7057ff"
  description: "Request for a new feature"

- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"

- name: "performance"
  color: "ff6b6b"
  description: "Performance improvements or issues"

- name: "optimization"
  color: "ff9f43"
  description: "Code optimization and refactoring"

- name: "security"
  color: "b60205"
  description: "Security-related issues"

- name: "needs-triage"
  color: "f9d0c4"
  description: "Issues that need to be triaged"

# Feature Area Labels
- name: "ui/ux"
  color: "e99695"
