name: 🧪 Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: 📦 Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🧪 Run unit tests
      run: |
        python tests/test_runner.py --type unit --coverage

    - name: 🔗 Run integration tests
      run: |
        python tests/test_runner.py --type integration

    - name: 🎯 Run end-to-end tests
      run: |
        python tests/test_runner.py --type e2e

    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./reports/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: 📋 Generate test report
      if: always()
      run: |
        python tests/test_runner.py --report

    - name: 📤 Upload test reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-reports-${{ matrix.python-version }}
        path: |
          reports/
          .coverage

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 mypy
        pip install -r requirements.txt

    - name: 🔍 Run linting
      run: |
        python tests/test_runner.py --lint

    - name: 🔍 Run type checking
      run: |
        python tests/test_runner.py --type-check

  security:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
        pip install -r requirements.txt

    - name: 🔒 Run security checks
      run: |
        safety check
        bandit -r tools/ -f json -o security-report.json

    - name: 📤 Upload security report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-report
        path: security-report.json

  performance:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: ⚡ Run performance tests
      run: |
        python tests/test_runner.py --type performance

  docker-test:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: 🏗️ Build Docker image
      run: |
        docker build -t stardust-chatbot:test .

    - name: 🧪 Run tests in Docker
      run: |
        docker run --rm stardust-chatbot:test python tests/test_runner.py --type unit

  notify:
    runs-on: ubuntu-latest
    needs: [test, lint, security, performance, docker-test]
    if: always()
    steps:
    - name: 📢 Notify test results
      run: |
        if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.lint.result }}" == "success" ]; then
          echo "✅ All tests passed!"
        else
          echo "❌ Some tests failed!"
          exit 1
        fi
